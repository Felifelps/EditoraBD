{% extends "base.html" %}
{% block title %}Edicoes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Edicoes</h1>
    <a class="btn btn-primary" href="/edicoes/novo">Nova edicao</a>
</div>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Jornal</th>
            <th>Numero</th>
            <th>Data</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for e in edicoes %}
        <tr>
            <td>{{ e.nome_jornal }}</td>
            <td>{{ e.numero_edicao }}</td>
            <td>{{ e.data or "-" }}</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" href="/edicoes/{{ e.nome_jornal }}/{{ e.numero_edicao }}">Ver</a>
                <a class="btn btn-sm btn-outline-secondary" href="/edicoes/{{ e.nome_jornal }}/{{ e.numero_edicao }}/editar">Editar</a>
                <form method="post" action="/edicoes/{{ e.nome_jornal }}/{{ e.numero_edicao }}/deletar" class="d-inline"
                      onsubmit="return confirm('Excluir edicao?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-muted">Nenhuma edicao cadastrada.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
