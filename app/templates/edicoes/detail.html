{% extends "base.html" %}
{% block title %}{{ edicao.nome_jornal }} - Edicao {{ edicao.numero_edicao }}{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <p class="text-muted mb-1 small">Edição</p>
        <h1 class="h3 mb-0">{{ edicao.nome_jornal }} — nº {{ edicao.numero_edicao }}</h1>
    </div>
    <a class="btn btn-outline-secondary" href="/edicoes">Voltar</a>
</div>

<div class="card detail-card shadow-sm border-0">
    <div class="card-body">
        <dl class="detail-grid">
            <div>
                <dt>Data</dt>
                <dd>{{ edicao.data or "-" }}</dd>
            </div>
        </dl>
        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-primary" href="/edicoes/{{ edicao.nome_jornal }}/{{ edicao.numero_edicao }}/editar">Editar</a>
            <form method="post" action="/edicoes/{{ edicao.nome_jornal }}/{{ edicao.numero_edicao }}/deletar" class="d-inline"
                  onsubmit="return confirm('Excluir edicao?')">
                <button class="btn btn-outline-danger" type="submit">Excluir</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
