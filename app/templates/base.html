<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Gestao Editorial
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

</head>

<body class="bg-light">

    <!-- =====================================================
         NAVEGAÇÃO
         ===================================================== -->

    <nav
        class="navbar navbar-expand navbar-dark bg-dark px-3 shadow-sm"
    >

        <a
            class="navbar-brand"
            href="/"
        >
            Gestao Editorial
        </a>

        <div class="navbar-nav me-auto">

            <a
                class="nav-link text-light {{ 'active' if request.url.path.startswith('/relatorios') }}"
                href="/relatorios"
            >
                Relatorios
            </a>

            <a
                class="nav-link text-light {{ 'active' if request.url.path.startswith('/funcionarios') }}"
                href="/funcionarios"
            >
                Funcionarios
            </a>

            <a
                class="nav-link text-light {{ 'active' if request.url.path.startswith('/jornais') }}"
                href="/jornais"
            >
                Jornais
            </a>

            <a
                class="nav-link text-light {{ 'active' if request.url.path.startswith('/edicoes') }}"
                href="/edicoes"
            >
                Edicoes
            </a>

            <a
                class="nav-link text-light {{ 'active' if request.url.path.startswith('/setores') }}"
                href="/setores"
            >
                Setores
            </a>

            <a
                class="nav-link text-light {{ 'active' if request.url.path.startswith('/materias') }}"
                href="/materias"
            >
                Materias
            </a>

        </div>

        {% if request.session.get("cpf") %}

        <div class="d-flex align-items-center gap-2">

            <span class="text-light small">
                {{ request.session.get("nome") }}
            </span>

            <form method="post" action="/logout" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    Sair
                </button>
            </form>

        </div>

        {% endif %}

    </nav>

    <!-- =====================================================
         CONTEÚDO
         ===================================================== -->

    <main class="container-fluid py-4">

        {% block content %}
        {% endblock %}

    </main>

    <!-- =====================================================
         BOOTSTRAP
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block scripts %}
    {% endblock %}

</body>

</html>
