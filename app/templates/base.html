<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Gestao Editorial{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/">Gestao Editorial</a>
        {% if user %}
        <span class="navbar-text text-light me-3">{{ user.nome }} ({{ user.tipo }})</span>
        <form method="post" action="/logout" class="d-flex">
            <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
        </form>
        {% endif %}
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
