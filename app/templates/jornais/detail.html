{% extends "base.html" %}
{% block title %}{{ jornal.nome_jornal }}{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <p class="text-muted mb-1 small">Jornal</p>
        <h1 class="h3 mb-0">{{ jornal.nome_jornal }}</h1>
    </div>
    <a class="btn btn-outline-secondary" href="/jornais">Voltar</a>
</div>

<div class="card detail-card shadow-sm border-0">
    <div class="card-body">
        <dl class="detail-grid">
            <div>
                <dt>Diretor</dt>
                <dd>{{ jornal.nome_diretor or "-" }}</dd>
            </div>
        </dl>
        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-primary" href="/jornais/{{ jornal.nome_jornal }}/editar">Editar</a>
            <form method="post" action="/jornais/{{ jornal.nome_jornal }}/deletar" class="d-inline"
                  onsubmit="return confirm('Excluir jornal?')">
                <button class="btn btn-outline-danger" type="submit">Excluir</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
