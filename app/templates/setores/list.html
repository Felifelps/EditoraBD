{% extends "base.html" %}
{% block title %}Setores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Setores</h1>
    <a class="btn btn-primary" href="/setores/novo">Novo setor</a>
</div>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Editor-chefe</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for s in setores %}
        <tr>
            <td>{{ s.id_setor }}</td>
            <td>{{ s.nome }}</td>
            <td>{{ s.nome_editor_chefe or "-" }}</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" href="/setores/{{ s.id_setor }}">Ver</a>
                <a class="btn btn-sm btn-outline-secondary" href="/setores/{{ s.id_setor }}/editar">Editar</a>
                <form method="post" action="/setores/{{ s.id_setor }}/deletar" class="d-inline"
                      onsubmit="return confirm('Excluir setor?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-muted">Nenhum setor cadastrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
